kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
ALLOW_PAID_API_CALLS = "true"
PRODUCTION_AI_ENABLED = "true"
PRODUCTION_AI_DAILY_CAP = "10"
PRODUCTION_AI_SESSION_CAP = "5"
PRODUCTION_AI_BUDGET_START = "2026-11-22T11:20:00Z"
PRODUCTION_AI_BUDGET_END = "2026-11-22T13:20:00Z"

[services.production.health.startup]
path = "/api/healthz"
