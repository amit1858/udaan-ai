name: Verify Udaan
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:init
      - run: pnpm seed
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/udaan-ai run build
        env:
          PORT: "5173"
          BASE_PATH: /
      # Browser verification requires the shared path proxy. It is executed in the Replit
      # preview and included in the review pack, not falsely claimed to run in this job.
