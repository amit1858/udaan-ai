openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Udaan AI discovery-to-learning API. Monetary API amounts are rupees; calculations use integer paise.
servers:
  - url: /api
paths:
  /udaan/voice-lab/status:
    get:
      operationId: getVoiceLabStatus
      responses:
        "200":
          description: Non-billable access and configuration status; sensitive fields masked until admin login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceLabStatus" }
  /udaan/voice-lab/login:
    post:
      operationId: loginVoiceLab
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceLoginInput" }
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceLabStatus" }
  /udaan/voice-lab/logout:
    post:
      operationId: logoutVoiceLab
      responses:
        "200":
          description: Admin session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceLabStatus" }
  /udaan/voice-lab/authorization:
    patch:
      operationId: authorizeVoiceLab
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceAuthorizationInput" }
      responses:
        "200":
          description: Explicit admin authorization updated without making a provider call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceLabStatus" }
  /udaan/voice-lab/test:
    post:
      operationId: testVoiceLabConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceConfirmedInput" }
      responses:
        "200":
          description: One minimal TTS provider request result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceOperation" }
  /udaan/voice-lab/transcribe:
    post:
      operationId: transcribeVoice
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Language" }
        - name: confirmed
          in: query
          required: true
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Bounded PCM WAV transcription; audio is not persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceOperation" }
  /udaan/voice-lab/synthesize:
    post:
      operationId: synthesizeVoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSynthesisInput" }
      responses:
        "200":
          description: Bounded speech synthesis; audio is returned transiently, not stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceOperation" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /udaan/state:
    get:
      operationId: getUdaanState
      responses:
        "200":
          description: Cookie-isolated persistent business state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessState" }
  /udaan/profile:
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /udaan/preferences:
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesInput" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
  /udaan/opportunities:
    get:
      operationId: getOpportunities
      parameters:
        - in: query
          name: language
          schema: { $ref: "#/components/schemas/Language" }
      responses:
        "200":
          description: Contextual discovery
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Opportunity" }
  /udaan/conversation:
    get:
      operationId: getConversation
      responses:
        "200":
          description: Persistent messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
  /udaan/chat:
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "200":
          description: Validated contextual response; live errors never silently become demo responses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /udaan/evaluate:
    post:
      operationId: evaluateFinance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceInput" }
      responses:
        "200":
          description: Authoritative deterministic calculation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Financials" }
  /udaan/experiments:
    get:
      operationId: getExperiments
      responses:
        "200":
          description: Experiments with outcomes and linked learning
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Experiment" }
    post:
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentInput" }
      responses:
        "201":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
  /udaan/experiments/{id}/transition:
    post:
      operationId: transitionExperiment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        "200":
          description: Validated lifecycle transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
  /udaan/experiments/{id}/results:
    post:
      operationId: recordResults
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsInput" }
      responses:
        "200":
          description: Completed experiment with calculated learning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
  /udaan/providers:
    get:
      operationId: getProviders
      responses:
        "200":
          description: Safe configuration status, never secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderStatus" }
  /udaan/providers/test:
    post:
      operationId: testProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderTestInput" }
      responses:
        "200":
          description: Bounded test, gated by server permission and configured credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderStatus" }
  /udaan/demo/reset:
    post:
      operationId: resetDemo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetInput" }
      responses:
        "200":
          description: Reset only current isolated demonstration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessState" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Language:
      type: string
      enum: [en, hinglish, hi, kn]
    Provider:
      type: string
      enum: [demo, openai, anthropic]
    Preferences:
      type: object
      required: [language, provider, onboarded]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        provider: { $ref: "#/components/schemas/Provider" }
        onboarded: { type: boolean }
    PreferencesInput:
      type: object
      properties:
        language: { $ref: "#/components/schemas/Language" }
        provider: { $ref: "#/components/schemas/Provider" }
        onboarded: { type: boolean }
    MenuItem:
      type: object
      required: [name, price, cost]
      properties:
        name: { type: string }
        price: { type: number }
        cost: { type: number }
    Profile:
      type: object
      required: [shopName, ownerName, category, location, openingHours, challenge, budget, averageOrders, menu, provenance]
      properties:
        shopName: { type: string }
        ownerName: { type: string }
        category: { type: string }
        location: { type: string }
        openingHours: { type: string }
        challenge: { type: string }
        budget: { type: number }
        averageOrders: { type: number }
        menu:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
        provenance: { type: string }
    ProfileInput:
      type: object
      properties:
        shopName: { type: string, minLength: 1, maxLength: 100 }
        ownerName: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string }
        location: { type: string }
        openingHours: { type: string }
        challenge: { type: string }
        budget: { type: number, minimum: 0, maximum: 1000000 }
        averageOrders: { type: number, minimum: 0 }
        menu:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
    Sale:
      type: object
      required: [date, orders, revenue, variableCosts, synthetic]
      properties:
        date: { type: string }
        orders: { type: integer }
        revenue: { type: number }
        variableCosts: { type: number }
        synthetic: { type: boolean }
    Baseline:
      type: object
      required: [revenue, orders, averageOrderValue, variableCosts, contribution]
      properties:
        revenue: { type: number }
        orders: { type: integer }
        averageOrderValue: { type: number }
        variableCosts: { type: number }
        contribution: { type: number }
    BusinessState:
      type: object
      required: [profile, preferences, sales, baseline, experimentCount, completedCount, recentLearning]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        preferences: { $ref: "#/components/schemas/Preferences" }
        sales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        baseline: { $ref: "#/components/schemas/Baseline" }
        experimentCount: { type: integer }
        completedCount: { type: integer }
        recentLearning:
          type: array
          items: { $ref: "#/components/schemas/Learning" }
    Opportunity:
      type: object
      required: [id, title, category, description, whyItFits, image, imageAlt, budget, benefit, assumptions, story, firstStep, actionable, sellingPrice, makingCost, expectedUnits, promotionBudget, durationDays]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string, enum: [experiment, story, technology] }
        description: { type: string }
        whyItFits: { type: string }
        image: { type: string }
        imageAlt: { type: string }
        budget: { type: number }
        benefit: { type: string }
        assumptions:
          type: array
          items: { type: string }
        story: { type: string }
        firstStep: { type: string }
        actionable: { type: boolean }
        sellingPrice: { type: number }
        makingCost: { type: number }
        expectedUnits: { type: integer }
        promotionBudget: { type: number }
        durationDays: { type: integer }
    FinanceInput:
      type: object
      required: [sellingPrice, makingCost, promotionBudget, expectedUnits]
      properties:
        sellingPrice: { type: number, minimum: 0, maximum: 100000 }
        makingCost: { type: number, minimum: 0, maximum: 100000 }
        promotionBudget: { type: number, minimum: 0, maximum: 1000000 }
        expectedUnits: { type: integer, minimum: 1, maximum: 100000 }
    Financials:
      type: object
      required: [units, unitContribution, revenue, variableCosts, promotionCost, contributionBeforePromotion, contributionAfterPromotion, breakEvenUnits, overheadExcluded]
      properties:
        units: { type: integer }
        unitContribution: { type: number }
        revenue: { type: number }
        variableCosts: { type: number }
        promotionCost: { type: number }
        contributionBeforePromotion: { type: number }
        contributionAfterPromotion: { type: number }
        breakEvenUnits: { type: [integer, "null"] }
        overheadExcluded: { type: boolean }
    ExperimentInput:
      allOf:
        - { $ref: "#/components/schemas/FinanceInput" }
        - type: object
          required: [opportunityId, durationDays]
          properties:
            opportunityId: { type: string }
            durationDays: { type: integer, enum: [7] }
            parentExperimentId: { type: string }
    TransitionInput:
      type: object
      required: [status, confirmed]
      properties:
        status: { type: string, enum: [Approved, Running, Cancelled] }
        confirmed: { type: boolean }
    ResultsInput:
      type: object
      required: [actualUnits, actualPromotionSpend, feedback, confirmed, synthetic]
      properties:
        actualUnits: { type: integer, minimum: 0, maximum: 100000 }
        actualPromotionSpend: { type: number, minimum: 0, maximum: 1000000 }
        feedback: { type: string, maxLength: 2000 }
        observations: { type: string, maxLength: 2000 }
        confirmed: { type: boolean }
        synthetic: { type: boolean }
    LifecycleEvent:
      type: object
      required: [status, at]
      properties:
        status: { type: string }
        at: { type: string }
    Learning:
      type: object
      required: [experimentId, outcome, whatHappened, whatWeLearned, nextAction, nextOpportunityId, nextBudget, achievement, unitVariance, contributionVariance]
      properties:
        experimentId: { type: string }
        outcome: { type: string, enum: [below, above, loss, insufficient, on_target] }
        whatHappened: { type: string }
        whatWeLearned: { type: string }
        nextAction: { type: string }
        nextOpportunityId: { type: string }
        nextBudget: { type: number }
        achievement: { type: number }
        unitVariance: { type: number }
        contributionVariance: { type: number }
    Experiment:
      type: object
      required: [id, opportunityId, title, status, sellingPrice, makingCost, promotionBudget, expectedUnits, durationDays, expected, createdAt, timeline]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        parentExperimentId: { type: [string, "null"] }
        title: { type: string }
        status: { type: string, enum: [Draft, Approved, Running, Completed, Cancelled] }
        sellingPrice: { type: number }
        makingCost: { type: number }
        promotionBudget: { type: number }
        expectedUnits: { type: integer }
        durationDays: { type: integer }
        expected: { $ref: "#/components/schemas/Financials" }
        actual: { $ref: "#/components/schemas/Financials" }
        actualUnits: { type: integer }
        actualPromotionSpend: { type: number }
        feedback: { type: string }
        observations: { type: string }
        synthetic: { type: boolean }
        learning: { $ref: "#/components/schemas/Learning" }
        createdAt: { type: string }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/LifecycleEvent" }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        voice: { type: boolean }
    Message:
      type: object
      required: [id, role, content, language, provider, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        speechText: { type: string }
        language: { $ref: "#/components/schemas/Language" }
        provider: { $ref: "#/components/schemas/Provider" }
        intent: { type: string }
        opportunityId: { type: string }
        followUp: { type: string }
        financials: { $ref: "#/components/schemas/Financials" }
        createdAt: { type: string }
        model: { type: string }
        tokens: { type: integer }
        market: { $ref: "#/components/schemas/MarketIntelligence" }
    MarketIntelligence:
      type: object
      required: [status, retrievedAt, facts]
      properties:
        status: { type: string, enum: [retrieved, unavailable] }
        retrievedAt: { type: string }
        facts:
          type: array
          items:
            type: object
            required: [name, url, locality, source, menu]
            properties:
              name: { type: string }
              url: { type: string }
              locality: { type: string }
              source: { type: string }
              updated: { type: string }
              menu:
                type: array
                items:
                  type: object
                  required: [name, section]
                  properties:
                    name: { type: string }
                    section: { type: string }
                    price: { type: number }
    VoiceLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 200 }
    VoiceAuthorizationInput:
      type: object
      required: [enabled, maxRequests, confirmed, creditCoverageConfirmed]
      properties:
        enabled: { type: boolean }
        maxRequests: { type: integer, minimum: 1, maximum: 10 }
        confirmed: { type: boolean }
        creditCoverageConfirmed: { type: boolean }
    VoiceSynthesisInput:
      type: object
      required: [text, language, confirmed]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        language: { $ref: "#/components/schemas/Language" }
        confirmed: { type: boolean }
    VoiceConfirmedInput:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
    VoiceOperation:
      type: object
      required: [id, operation, model, status, latencyMs, estimatedCostInr, createdAt]
      properties:
        id: { type: string }
        operation: { type: string }
        model: { type: string }
        speaker: { type: string }
        status: { type: string }
        latencyMs: { type: integer }
        estimatedCostInr: { type: number }
        createdAt: { type: string }
        transcript: { type: string }
        audioBase64: { type: string }
        audioMime: { type: string }
        requestId: { type: string }
        inputCharacters: { type: integer }
        inputSeconds: { type: number }
        error: { type: string }
        httpStatus: { type: integer }
    VoiceLabStatus:
      type: object
      required: [access, state, configured, setupRequired, paidEnabled, maxRequests, usedRequests, estimatedCostInr, requests]
      properties:
        access: { type: string, enum: [disabled, locked, admin] }
        state: { type: string, enum: [not_configured, ready_to_test, connected, error] }
        configured: { type: boolean }
        setupRequired: { type: boolean }
        paidEnabled: { type: boolean }
        maxRequests: { type: integer }
        usedRequests: { type: integer }
        estimatedCostInr: { type: number }
        requests:
          type: array
          items: { $ref: "#/components/schemas/VoiceOperation" }
    ProviderStatus:
      type: object
      required: [id, name, configured, model, status, paidCallsAllowed]
      properties:
        id: { $ref: "#/components/schemas/Provider" }
        name: { type: string }
        configured: { type: boolean }
        model: { type: string }
        status: { type: string }
        paidCallsAllowed: { type: boolean }
        lastTest: { type: string }
    ProviderTestInput:
      type: object
      required: [provider, confirmed]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        confirmed: { type: boolean }
    ResetInput:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
