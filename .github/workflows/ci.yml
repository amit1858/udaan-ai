name: Verify Udaan
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: udaan_test
          POSTGRES_PASSWORD: fixture-password-only
          POSTGRES_DB: udaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udaan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://udaan_test:fixture-password-only@localhost:5432/udaan_test
      ALLOW_PAID_API_CALLS: "false"
      MAX_PAID_API_CALLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:init
      - run: pnpm seed
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/udaan-ai run build
        env:
          PORT: "5173"
          BASE_PATH: /
      # Browser verification requires the shared path proxy. It is executed in the Replit
      # preview and included in the review pack, not falsely claimed to run in this job.
